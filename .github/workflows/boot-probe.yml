name: Experimental boot marker

on:
  push:
    branches: ['codex/**']
    paths: ['src/boot_probe/**', 'tests/boot_probe/**', 'tools/boot_probe/**', '.github/workflows/boot-probe.yml']
  pull_request:
    branches: [master]
    paths: ['src/boot_probe/**', 'tests/boot_probe/**', 'tools/boot_probe/**', '.github/workflows/boot-probe.yml']

jobs:
  fixtures-and-cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build and exercise native fixtures
        run: |
          python3 tools/boot_probe/build.py --arch x86_64 --tests
          build/boot-probe/x86_64/tests/check build/boot-probe/x86_64/tests/gps.default.so build/boot-probe/x86_64/tests/stock.so build/boot-probe/x86_64/tests/missing.so
      - name: Build and audit ARM64 proxy
        run: python3 tools/boot_probe/build.py --arch aarch64
